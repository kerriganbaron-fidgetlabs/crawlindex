name: Nightly crawl

# The whole engine. Crawls the corpus, writes the dataset, and opens a pull request that
# merges itself. Merging to main triggers the Vercel production deploy, so this one job is
# the entire publishing pipeline.
#
# It runs on GitHub's infrastructure rather than a machine in someone's house. The crawl
# used to be a Windows scheduled task, which meant the index only updated when that PC
# happened to be awake, burned electricity, and made a supposedly hands-off project depend
# on one person's hardware.
#
# COST: this repository is public, and public repositories get unlimited Actions minutes.
# A full pass is roughly 40 minutes of runner time and costs nothing. If it is ever made
# private again that becomes ~1,200 of the 2,000 free monthly minutes, and the schedule
# would need revisiting.
#
# WHY A PULL REQUEST: main requires one. There is no bypass, deliberately, and GitHub does
# not permit the Actions app as a bypass actor on a user-owned repository anyway. Rather
# than weaken the rule, the bot follows it. Every night's data lands as a reviewable diff
# with a summary of what moved.

on:
  schedule:
    # 02:30 UTC. Deliberately off the hour, when GitHub's scheduler is most congested.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max domains to crawl'
        required: false
        default: '100000'
      reseed:
        description: 'Refresh the Tranco corpus first'
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly-crawl
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # No `version`: package.json pins packageManager, and specifying both makes the
      # action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The rubric and the robots.txt semantics are the trust core. If they are broken,
      # publishing a dataset scored by them is worse than publishing nothing.
      - name: Test before publishing anything
        run: pnpm test

      - name: Refresh corpus on Mondays
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event.inputs.reseed }}" = "true" ]; then
            pnpm seed --count 5000
          else
            echo "Not Monday and no reseed requested. Keeping the existing corpus."
          fi

      - name: Crawl
        env:
          CRAWLINDEX_VANTAGE: gha-ubuntu
        run: pnpm crawl --limit ${{ github.event.inputs.limit || 100000 }} --concurrency 20

      - name: Verify the dataset builds before publishing it
        run: pnpm build

      - name: Open and merge the data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No dataset changes. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DAY=$(date -u +%Y-%m-%d)
          BRANCH="data/${DAY}-${GITHUB_RUN_ID}"

          # Summarise what actually moved, so the PR reads as a changelog rather than a
          # multi-megabyte diff nobody will open.
          node scripts/crawl-summary.mjs "$DAY" > /tmp/summary.md
          cat /tmp/summary.md

          # git rejects -m together with -F, so the subject goes into the message file.
          echo "Nightly crawl ${DAY}" > /tmp/commit.md
          echo "" >> /tmp/commit.md
          cat /tmp/summary.md >> /tmp/commit.md

          git config user.name "CrawlIndex Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -F /tmp/commit.md
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "Nightly crawl ${DAY}" --body-file /tmp/summary.md
          gh pr merge "$BRANCH" --squash --delete-branch

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Say so loudly if it failed
        if: failure()
        run: |
          echo "The nightly crawl failed. The previously published dataset is untouched and the site is still serving it." >> "$GITHUB_STEP_SUMMARY"
