name: Nightly crawl

# The whole engine. Crawls the corpus, writes the dataset, and opens a pull request that
# merges itself. Merging to main triggers the Vercel production deploy, so this one job is
# the entire publishing pipeline.
#
# It runs on GitHub's infrastructure rather than a machine in someone's house. The crawl
# used to be a Windows scheduled task, which meant the index only updated when that PC
# happened to be awake, burned electricity, and made a supposedly hands-off project depend
# on one person's hardware.
#
# COST: this repository is public, and public repositories get unlimited Actions minutes.
# A full pass is roughly 40 minutes of runner time and costs nothing. If it is ever made
# private again that becomes ~1,200 of the 2,000 free monthly minutes, and the schedule
# would need revisiting.
#
# WHY A PULL REQUEST: main requires one. There is no bypass, deliberately, and GitHub does
# not permit the Actions app as a bypass actor on a user-owned repository anyway. Rather
# than weaken the rule, the bot follows it. Every night's data lands as a reviewable diff
# with a summary of what moved.

on:
  schedule:
    # 02:30 UTC. Deliberately off the hour, when GitHub's scheduler is most congested.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max domains to crawl'
        required: false
        default: '100000'
      reseed:
        description: 'Refresh the Tranco corpus first'
        type: boolean
        required: false
        default: false
      force:
        description: 'Bypass the health gate and replace today''s snapshot. Use after a quarantine, or when a rubric change is known to move every score.'
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly-crawl
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Domain submissions arrive as issues. The intake step reads the open ones, adds the
  # valid domains to the corpus, and closes each with a comment. Nothing outside this
  # repository is touched and no secret beyond the built-in token is involved.
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # No `version`: package.json pins packageManager, and specifying both makes the
      # action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The rubric and the robots.txt semantics are the trust core. If they are broken,
      # publishing a dataset scored by them is worse than publishing nothing.
      - name: Test before publishing anything
        run: pnpm test

      - name: Refresh corpus on Mondays
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event.inputs.reseed }}" = "true" ]; then
            pnpm seed --count 5000
          else
            echo "Not Monday and no reseed requested. Keeping the existing corpus."
          fi

      # After the reseed, so a submitted domain is not wiped by the Tranco rebuild in the
      # same run, and before the crawl, so it is measured tonight rather than tomorrow.
      # This step never fails the job: the worker catches its own errors, because a
      # submission that cannot be read is not a reason to skip publishing the index.
      - name: Take in submitted domains
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm intake

      - name: Crawl
        env:
          CRAWLINDEX_VANTAGE: gha-ubuntu
        run: pnpm crawl --limit ${{ github.event.inputs.limit || 100000 }} --concurrency 20 ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # Cheap, and it fails the run before anything is published. Proves that every archived
      # record still rescores to the number it was published with, which is the invariant the
      # access-map bug broke while every other check stayed green.
      - name: Verify archived records still rescore correctly
        run: pnpm verify:rescore

      # A quarantine is not a failure: the crawl succeeds, the job goes green, and without
      # this nothing tells anybody. That was a real gap. The one genuinely new silent
      # failure mode had no notification while the loud one already had two.
      - name: Open an issue if the run was quarantined
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SUSPECT=$(node -e "
            const s=require('./data/stats.json');
            const last=s[s.length-1];
            if(!last||!last.suspect){process.exit(0)}
            console.log(JSON.stringify({day:last.day,reasons:last.suspectReasons||[]}));
          ")
          if [ -z "$SUSPECT" ]; then
            echo "Run passed the health check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DAY=$(echo "$SUSPECT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).day))")
          REASONS=$(echo "$SUSPECT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).reasons.map(r=>'- '+r).join('\n')))")

          BODY="The crawl on ${DAY} was quarantined. Its figures are not published and the site is serving the last day that passed.

          ${REASONS}

          The observations were still written, so the evidence is in the repository. If the shift is legitimate, the next run will reproduce it and the baseline moves automatically. If it does not, re-run the workflow with \`force: true\` once the cause is understood.

          Run: ${RUN_URL}"

          EXISTING=$(gh issue list --label crawl-quarantine --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Crawl quarantined" --label crawl-quarantine --body "$BODY"
          fi
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the dataset builds before publishing it
        run: pnpm build

      - name: Open and merge the data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No dataset changes. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DAY=$(date -u +%Y-%m-%d)
          BRANCH="data/${DAY}-${GITHUB_RUN_ID}"

          # Summarise what actually moved, so the PR reads as a changelog rather than a
          # multi-megabyte diff nobody will open.
          node scripts/crawl-summary.mjs "$DAY" > /tmp/summary.md
          cat /tmp/summary.md

          # git rejects -m together with -F, so the subject goes into the message file.
          echo "Nightly crawl ${DAY}" > /tmp/commit.md
          echo "" >> /tmp/commit.md
          cat /tmp/summary.md >> /tmp/commit.md

          git config user.name "CrawlIndex Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -F /tmp/commit.md
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "Nightly crawl ${DAY}" --body-file /tmp/summary.md
          gh pr merge "$BRANCH" --squash --delete-branch

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Say so loudly if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "The nightly crawl failed. The previously published dataset is untouched and the site is still serving it." >> "$GITHUB_STEP_SUMMARY"

          # A line in the step summary is a notification nobody receives. An issue is one
          # somebody actually sees, and it costs no secret: GITHUB_TOKEN already has
          # issues:write from the submission intake.
          #
          # Reuse a single open issue rather than filing one a night, so a week of failures
          # is one thread instead of seven duplicates.
          EXISTING=$(gh issue list --label crawl-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          BODY="The nightly crawl failed on $(date -u +%Y-%m-%d).

          The previously published dataset is untouched and the site is still serving it, so
          this is a stale-data problem rather than a broken-site problem.

          Run: ${RUN_URL}"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Nightly crawl failing" --label crawl-failure --body "$BODY"
          fi
