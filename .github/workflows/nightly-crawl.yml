name: Nightly crawl

# Runs the index off GitHub's infrastructure rather than the Builder machine.
#
# The gaming PC was the wrong host: the crawl only ran when that machine happened to be
# awake, it burned electricity, and it made a supposedly hands-off project depend on
# Kerrigan's hardware. A hosted runner removes all three.
#
# COST, measured not guessed. A 150-domain run took 97s wall (75s of crawl). Hosted
# runners are slower than the Builder machine, roughly 0.5s per domain against 0.28s.
# A full 5,050-domain pass is therefore ~43 minutes, so ~1,300 minutes a month against
# the 2,000 free minutes a private repo gets. That is 65% of the whole account allowance
# consumed by one project, which is not "free" in any useful sense.
#
# Making this repository PUBLIC removes the limit entirely: public repos get unlimited
# Actions minutes. The dataset is CC BY 4.0 and all credentials live in Actions secrets,
# so there is nothing here to keep private. Until that happens, treat the minute budget
# as a real constraint and do not add a second scheduled job.

on:
  schedule:
    # 02:30 UTC. Deliberately not on the hour, when GitHub's scheduler is most congested.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max domains to crawl'
        required: false
        default: '6000'
      reseed:
        description: 'Refresh the Tranco corpus first'
        type: boolean
        required: false
        default: false

concurrency:
  # Never let a slow run overlap the next night's.
  group: nightly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # The crawl is I/O bound and polite by design, so it is slow on purpose. Give it room
    # but never let a hung run eat the monthly budget.
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      # No `version` here: package.json already pins packageManager, and specifying both
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh corpus
        # Mondays, or on demand. Re-seeding also retro-applies the exclusion rules.
        if: github.event.inputs.reseed == 'true' || github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event.inputs.reseed }}" = "true" ]; then
            pnpm seed --count 5000
          else
            echo "Not Monday and no reseed requested. Skipping."
          fi

      - name: Crawl
        run: pnpm crawl --limit ${{ github.event.inputs.limit || 6000 }} --concurrency 20

      - name: Summary
        if: always()
        run: echo "Crawl finished with status ${{ job.status }}." >> $GITHUB_STEP_SUMMARY
